name: Build Keyball61 Vial Firmware

on:
  push:
    paths:
      - "keyboards/keyball/**"
      - ".github/workflows/build-keyball.yml"
  pull_request:
    paths:
      - "keyboards/keyball/**"
      - ".github/workflows/build-keyball.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Keyball61 / ${{ matrix.keymap }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        keymap:
          - vial
          # Uncomment additional variants if desired:
          # - vial_left
          # - vial_right
          # - vial_dual
          # - vial_none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QMK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo ./util/qmk_install.sh -y

      - name: Install QMK Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install qmk

      - name: Configure QMK to use this repository
        shell: bash
        run: |
          set -euo pipefail
          qmk setup -H "$GITHUB_WORKSPACE" -y

      - name: Show versions
        shell: bash
        run: |
          python --version
          qmk --version
          git submodule status

      - name: Clean previous build output
        run: rm -rf .build

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          qmk compile -kb keyball/keyball61 -km "${{ matrix.keymap }}"

      - name: Collect firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware

          find . -maxdepth 1 -type f \( \
            -name '*.uf2' -o \
            -name '*.hex' -o \
            -name '*.bin' \
          \) -print -exec cp -v {} firmware/ \;

          echo "Built firmware:"
          ls -lah firmware

          test -n "$(find firmware -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-${{ matrix.keymap }}-${{ github.sha }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30
