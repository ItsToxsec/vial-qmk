name: Build Keyball61 Vial Firmware

on:
  push:
    paths:
      - "keyboards/keyball/**"
      - ".github/workflows/build-keyball.yml"
  pull_request:
    paths:
      - "keyboards/keyball/**"
      - ".github/workflows/build-keyball.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Keyball61 / ${{ matrix.keymap }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix:
        keymap:
          - vial
          # Uncomment any additional variants you want to build:
          # - vial_left
          # - vial_right
          # - vial_dual
          # - vial_none

    steps:
      - name: Allow repository in container
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show QMK information
        run: |
          qmk --version
          qmk doctor || true

      - name: Clean previous build output
        run: rm -rf .build

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          qmk compile -kb keyball/keyball61 -km "${{ matrix.keymap }}"

      - name: Collect firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware

          find . -maxdepth 1 -type f \( \
            -name '*.uf2' -o \
            -name '*.hex' -o \
            -name '*.bin' \
          \) -print -exec cp -v {} firmware/ \;

          echo "Built firmware:"
          ls -lah firmware

          test -n "$(find firmware -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-${{ matrix.keymap }}-${{ github.sha }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30
